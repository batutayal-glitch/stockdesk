name: 每日更新個股資料

on:
  schedule:
    # 台灣時間週一至週五 22:13（UTC 14:13）；融資融券、借券資料約晚上 9 點後才齊
    - cron: "13 14 * * 1-5"
  workflow_dispatch: {}
  # 修改抓資料腳本（例如增減觀察個股）時立即重跑一次
  push:
    branches: [main]
    paths: [update_data.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取資料
        run: python3 update_data.py || echo "部分來源失敗，仍提交已取得的資料"
      - name: 提交更新
        run: |
          git config user.name "stockdesk-bot"
          git config user.email "stockdesk-bot@users.noreply.github.com"
          git add week-data.js week-data.json week-audit.json stock-data.csv data/history.json
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash
          git push
